<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Turn Horizontal - Physics Text</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            overflow: hidden;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        #canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        #permissionBtn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 40px;
            font-size: 18px;
            background: #333;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            z-index: 1000;
            font-family: Arial, sans-serif;
        }

        #permissionBtn:active {
            background: #555;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <button id="permissionBtn" style="display: none;">Enable Motion Sensor</button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
